name: ci
on:
  push:
    branches: [main, nebius]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed secrets files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "A .env file is committed. Remove it and rotate its keys." && exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: make lint
      - run: make test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t money-guardian .
      - name: Image starts and answers
        run: |
          docker run -d --name mg -p 8790:8790 -e MG_OFFLINE=1 money-guardian
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8790/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8790/ | grep -q "<title>Money Guardian</title>"
          curl -fs -X POST "http://127.0.0.1:8790/api/chat?demo=ci000001" -H 'Content-Type: application/json' \
            -d '{"session_id":"ci","text":"What bills do I have?"}' | grep -q "looks wrong"
  publish:
    # The hosted demos pull this public image, only after the checks pass: main as :latest (Lightsail,
    # us-east-1), and the nebius branch as :nebius (the Nebius × NVIDIA entry, on a Nebius Serverless endpoint).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nebius')
    needs: [check, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push ghcr.io/tbd-hackathons/money-guardian
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/tbd-hackathons/money-guardian
          # main keeps its tags (:latest and :<sha>); the nebius branch gets :nebius and :nebius-<sha>.
          if [ "$GITHUB_REF_NAME" = main ]; then tags="-t $img:latest -t $img:${GITHUB_SHA::7}"; else tags="-t $img:nebius -t $img:nebius-${GITHUB_SHA::7}"; fi
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} $tags .
          docker push --all-tags $img
